# Deploy the landing site to GitHub Pages (PRD-SITE-008).
#
# No server, no database, no runtime dependency on the backend. That is the
# point rather than a limitation: the team's operational attention belongs on
# the Nakama server a pilot classroom depends on, not on keeping a brochure up.
#
# The dashboard lives in the same repository but is not deployed here. It talks
# to Nakama with a teacher's session and has no business on a public path.

name: pages

on:
  push:
    branches: [master, main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancelling one that has started: a
# half-published site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: build
        run: node site/build.mjs

      # Page weight, forbidden language, and student-facing downloads. All three
      # are requirements that erode one small edit at a time rather than
      # breaking outright, which is why they are checked on every build.
      - name: check
        run: node site/check.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
